name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: phsar
          POSTGRES_PASSWORD: phsar
          POSTGRES_DB: phsar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phsar"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://phsar:phsar@localhost:5432/phsar_test?sslmode=disable
      PHSAR_TEST_DATABASE_URL: postgres://phsar:phsar@localhost:5432/phsar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: ffmpeg (tes kompres video)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: QA (format, vet, build, unit, integrasi + migrasi up/reset/up, JS, rahasia)
        working-directory: .
        run: ./scripts/qa.sh
