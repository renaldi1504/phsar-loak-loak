<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Phsar · ធ្វើបច្ចុប្បន្នភាព · Updating · 更新中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700;9..40,800&family=Noto+Sans+Khmer:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap">
<!-- Disajikan Caddy saat backend mati / restart (502, 503, 504). Mandiri: tanpa file lain dari backend. -->
<style>
:root{--pink:#f50750;--pink-d:#d60044;--pink-50:#fff0f5;--navy:#102241;--muted:#7c8291;--line:#f3dbe5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font-family:"DM Sans","Noto Sans Khmer","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--navy);background:radial-gradient(ellipse at 70% 20%,#ffe4ee 0%,#fff6fa 45%,#fff 80%);line-height:1.5}
header{padding:18px max(20px,env(safe-area-inset-left))}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:24px;letter-spacing:-.5px}
.brand i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#ff7ba8,#f50750 56%,#c30963);display:grid;place-items:center}
.brand i::after{content:"";border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px max(20px,env(safe-area-inset-left)) 56px}
.box{text-align:center;max-width:480px;width:100%}
.ico{width:76px;height:76px;margin:0 auto 22px;border-radius:26px;background:var(--pink-50);display:grid;place-items:center}
.ico span{width:30px;height:30px;border:4px solid #ffc2d6;border-top-color:var(--pink);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ico span{animation-duration:3s}}
.msg{padding:14px 0;border-top:1px solid var(--line)}
.ico+.msg{border-top:0;padding-top:0}
h1{margin:0 0 4px;font-size:22px;line-height:1.35;text-wrap:balance}
p{margin:0;color:var(--muted);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:20px;padding:12px 28px;border-radius:999px;border:0;background:var(--pink);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn:hover{background:var(--pink-d)}
.btn:focus-visible{outline:3px solid #f5075055;outline-offset:2px}
.auto{margin-top:12px;font-size:13px}
</style>
</head>
<body>
<header><span class="brand"><i aria-hidden="true"></i>Phsar</span></header>
<main>
  <div class="box">
    <div class="ico" aria-hidden="true"><span></span></div>
    <div class="msg" lang="km"><h1>Phsar កំពុងធ្វើបច្ចុប្បន្នភាព</h1><p>យើងនឹងត្រឡប់មកវិញក្នុងរយៈពេលប៉ុន្មាននាទីទៀត។ កន្ត្រក និងការបញ្ជាទិញរបស់អ្នកនៅដដែល។</p></div>
    <div class="msg" lang="en"><h1>Phsar is being updated</h1><p>We'll be back in a few minutes. Your cart and orders are safe.</p></div>
    <div class="msg" lang="zh-Hans"><h1>Phsar 正在更新</h1><p>几分钟后恢复。您的购物车和订单都不会受影响。</p></div>
    <button type="button" class="btn" onclick="location.reload()">សាកល្បងម្តងទៀត · Try again · 重试</button>
    <p class="auto" id="auto"></p>
  </div>
</main>
<script>
// Muat ulang otomatis begitu backend kembali (cek /healthz tiap 15 detik).
(function(){var n=0,el=document.getElementById("auto");function tick(){n++;fetch("/healthz",{cache:"no-store"}).then(function(r){if(r.ok)location.reload()}).catch(function(){});if(n<40)setTimeout(tick,15000)}setTimeout(tick,15000);el.textContent="↻ 15s"})();
</script>
</body>
</html>
