openapi: 3.1.0
info:
  title: Phsar API
  version: 0.1.0
  description: |
    Satu backend untuk app Flutter (pembeli + mode seller), Seller Center, admin, dan webhook.
    Bahasa respons: query `lang`, header `X-Lang`, atau `Accept-Language` (en default, km, zh).
    File ini sumber untuk membuat client Dart (openapi-generator) di folder app/.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Proses hidup
      responses:
        "200": { description: OK }
  /readyz:
    get:
      summary: Database bisa dijangkau
      responses:
        "200": { description: Ready }
        "503": { description: Database tidak terjangkau }
  /v1/app/meta:
    get:
      summary: Bahasa, mata uang, kurs tampilan riel, wilayah layanan aktif
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
  /v1/app/service-areas/check:
    get:
      summary: Cek apakah titik peta berada di wilayah layanan (checkout & titik penjemputan)
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  served: { type: boolean }
                  service_area: { type: string }
                  message: { type: string }
  /v1/app/categories:
    get:
      summary: Pohon kategori dalam bahasa request
      responses:
        "200": { description: OK }
  /v1/app/auth/otp/request:
    post:
      summary: Kirim kode SMS 6 digit (dev: kode ditulis ke log server)
      requestBody: { content: { application/json: { schema: { type: object, properties: { phone: { type: string, example: "012 345 678" } } } } } }
      responses:
        "200": { description: "{phone, expires_in, resend_after}" }
        "429": { description: otp_too_soon / otp_rate_limited }
  /v1/app/auth/otp/verify:
    post:
      summary: Verifikasi kode → sesi (user baru dibuat otomatis)
      requestBody: { content: { application/json: { schema: { type: object, properties: { phone: { type: string }, code: { type: string }, device_name: { type: string } } } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }
        "401": { description: otp_invalid / otp_exhausted }
  /v1/app/auth/telegram/start:
    post:
      summary: Mulai login Telegram → buka deep_link / app_link, lalu polling
      responses:
        "200": { description: "{request_id, poll_token, deep_link, app_link, expires_at}" }
  /v1/app/auth/telegram/poll:
    post:
      summary: "Polling tiap 1–2 detik: status pending · ok (berisi tokens) · expired"
      requestBody: { content: { application/json: { schema: { type: object, properties: { request_id: { type: string }, poll_token: { type: string } } } } } }
      responses:
        "200": { description: "{status, tokens?}" }
  /v1/app/auth/refresh:
    post:
      summary: Tukar refresh token (dirotasi; token lama langsung mati)
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }
        "401": { description: session_invalid }
  /v1/app/auth/logout:
    post:
      summary: Cabut sesi perangkat ini
      responses:
        "204": { description: OK }
  /v1/app/me:
    get:
      summary: User yang sedang login (Authorization Bearer access_token)
      security: [{ bearer: [] }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { description: token_expired → panggil /auth/refresh · session_invalid → login ulang }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        language: { type: string, enum: [en, km, zh] }
        is_new: { type: boolean, description: "true = tampilkan onboarding/tour" }
        has_store: { type: boolean, description: "true = tampilkan tombol mode seller" }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    Meta:
      type: object
      properties:
        languages: { type: array, items: { type: string, enum: [en, km, zh] } }
        lang: { type: string }
        currency: { type: string, example: USD }
        riel_per_usd: { type: string, example: "4000.0000" }
        cash_on_delivery: { type: boolean }
        service_areas:
          type: array
          items:
            type: object
            properties:
              code: { type: string, example: sihanoukville }
              name: { type: string }
              fee_per_store: { type: string, example: "0.00" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
